<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | GDG PW</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1E1F21;
            --blue: #4285F4;
            --red: #E74639;
            --yellow: #FBBC04;
            --green: #34A853;
            --gray-border: #5F6468;
            --white: #E8EAED;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Google Sans Code', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- TŁO: SYMBOLE KODU --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .code-symbol {
            position: absolute;
            opacity: 0.12;
            animation: floatSymbol 15s infinite linear;
            font-size: 1.2rem;
        }

        @keyframes floatSymbol {
            from { transform: translateY(110vh) rotate(0deg); }
            to { transform: translateY(-20vh) rotate(360deg); }
        }

        /* --- KONTENER --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 900px;
            padding: 20px 0;
        }

        /* --- LOGO --- */
        .branding {
            margin-bottom: 20px;
        }
        .main-logo {
            width: 500px; /* Desktop */
            height: auto;
            max-width: 95%; /* Żeby nie wyszło poza ekran na mobile */
        }

        /* --- TERMINAL + CORGI --- */
        .terminal-box {
            position: relative;
            margin: 80px auto 40px;
            width: 100%;
            max-width: 750px;
        }

        /* Animowany Corgi */
        .corgi-sprite {
            position: absolute;
            top: -95px;
            width: 160px;
            z-index: 12;
            cursor: pointer;
        }

        .corgi-img {
            width: 100%;
            display: block;
            animation: walkBounce 0.6s infinite alternate ease-in-out;
        }

        @keyframes walkBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }

        .corgi-img.happy {
            animation: happyWiggle 0.25s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 10px var(--yellow)) brightness(1.15);
        }

        @keyframes happyWiggle {
            from { transform: translateY(0) rotate(-6deg) translateX(-5px); }
            to   { transform: translateY(-10px) rotate(6deg) translateX(5px); }
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 1rem;
            animation: sparkleFly 0.55s ease-out forwards;
            z-index: 15;
        }

        @keyframes sparkleFly {
            0%   { opacity: 1; transform: scale(0.5); }
            55%  { opacity: 1; transform: scale(1.3) translateY(-6px); }
            100% { opacity: 0; transform: scale(0.7) translateY(-15px); }
        }

        .paw-print {
            position: absolute;
            font-size: 0.85rem;
            opacity: 0.6;
            pointer-events: none;
            bottom: -18px;
            animation: pawFade 1.2s forwards;
            z-index: 11;
        }

        @keyframes pawFade {
            to { opacity: 0; transform: translateY(6px); }
        }

        body.party .code-symbol {
            opacity: 0.35 !important;
            animation-duration: 5s !important;
        }

        body.party .terminal-text span {
            animation: colorCycle 0.4s infinite !important;
        }
        body.party .terminal-text span:nth-child(2) { animation-delay: 0.13s !important; }
        body.party .terminal-text span:nth-child(3) { animation-delay: 0.27s !important; }

        @keyframes colorCycle {
            0%   { color: var(--blue); }
            25%  { color: var(--red); }
            50%  { color: var(--yellow); }
            75%  { color: var(--green); }
            100% { color: var(--blue); }
        }

        .terminal.minimized .terminal-text { display: none; }

        .terminal.closed {
            opacity: 0.25;
            transform: scale(0.97);
        }

        .terminal-error-msg {
            color: var(--red);
            margin-top: 12px;
        }

        .terminal {
            background: rgba(30, 31, 33, 0.98);
            border: 3px solid var(--gray-border);
            border-radius: 20px;
            padding: 40px;
            text-align: left;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .terminal-header {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }

        .terminal-text {
            font-size: 1.2rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* --- PRZYCISK --- */
        .btn-action {
            display: flex;
            align-items: center;
            width: fit-content;
            margin: 20px auto 0;
            padding: 18px 40px;
            background: transparent;
            color: var(--white);
            text-decoration: none;
            border-radius: 14px;
            font-family: 'Google Sans Code', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            border: 3px solid var(--gray-border);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            border-color: var(--white);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
        }

        /* --- RESPONSYWNOŚĆ (MOBILE) --- */
        @media (max-width: 768px) {
            .container {
                margin-top: 0;
            }
            .main-logo {
                width: 320px; /* Mniejsze logo na telefonie */
            }
            .terminal-box {
                margin: 60px auto 30px;
            }
            .terminal {
                padding: 20px; /* Mniejszy padding wewnątrz terminala */
            }
            .terminal-text {
                font-size: 0.95rem; /* Mniejszy tekst, żeby się mieścił */
            }
            .corgi-sprite {
                width: 110px; /* Mniejszy corgi na telefonie */
                top: -65px;
            }
            .btn-action {
                padding: 15px 25px;
                font-size: 0.9rem;
                width: 100%; /* Przycisk na całą szerokość dla wygody kciuka */
                box-sizing: border-box;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>

    <div class="container">
        <div class="branding">
            <img src="logo.svg" alt="GDG On Campus PW" class="main-logo">
        </div>

        <div class="terminal-box">
            <div class="corgi-sprite">
                <img src="bugs.png" alt="Corgi Debugger" class="corgi-img">
            </div>

            <div class="terminal">
                <div class="terminal-header">
                    <div class="dot dot-red" style="background: var(--red)"></div>
                    <div class="dot dot-yellow" style="background: var(--yellow)"></div>
                    <div class="dot dot-green" style="background: var(--green)"></div>
                </div>
                <div class="terminal-text">
                    <span style="color: var(--red)">[STATUS]</span> 404: Nie znaleziono.<br>
                    <span style="color: var(--blue)">[LOGI]</span> Corgi szukał, ale tu jest pusto.<br>
                    <span style="color: var(--yellow)">[INFO]</span> Sugerowany powrót do bazy.
                </div>
            </div>
        </div>

        <a href="https://gdgpw.pl" class="btn-action">
            <img src="home.svg" width="28" height="28" alt="" style="margin-right: 10px;">
            $ cd /home
        </a>
    </div>

    <script>
        // Background symbols
        const canvas = document.getElementById('bg-canvas');
        const colors = ['#4285F4', '#E74639', '#FBBC04', '#34A853'];
        const symbols = ['{ }', '< >', '[ ]', ';;', 'if()', '=>', 'null', 'git'];

        function spawnSymbol() {
            const span = document.createElement('span');
            span.className = 'code-symbol';
            span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            span.style.color = colors[Math.floor(Math.random() * colors.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 8 + 12) + 's';
            span.style.animationDelay = -(Math.random() * 20) + 's';
            canvas.appendChild(span);
        }
        for (let i = 0; i < 15; i++) spawnSymbol();

        // Corgi JS movement
        const corgiSprite  = document.querySelector('.corgi-sprite');
        const corgiImg     = document.querySelector('.corgi-img');
        const terminalBox  = document.querySelector('.terminal-box');
        const terminal     = document.querySelector('.terminal');
        const terminalText = document.querySelector('.terminal-text');

        let corgiX    = 0;
        let direction = 1;
        let pausing   = false;
        let happyMode = false;
        let partySpeed = 1;
        const BASE_SPEED = 1.5;
        const PAUSE_MS   = 1200;

        function getMaxX() {
            return terminalBox.offsetWidth - corgiSprite.offsetWidth;
        }

        function edgePause() {
            pausing = true;
            corgiImg.style.animationPlayState = 'paused';
            setTimeout(() => {
                direction *= -1;
                corgiImg.style.animationPlayState = 'running';
                pausing = false;
            }, PAUSE_MS);
        }

        function tick() {
            if (!pausing && !happyMode) {
                corgiX += BASE_SPEED * partySpeed * direction;
                const maxX = getMaxX();
                if (corgiX >= maxX) {
                    corgiX = maxX;
                    partySpeed > 1 ? (direction *= -1) : edgePause();
                } else if (corgiX <= 0) {
                    corgiX = 0;
                    partySpeed > 1 ? (direction *= -1) : edgePause();
                }
                corgiSprite.style.left = corgiX + 'px';
                corgiSprite.style.transform = `scaleX(${direction})`;
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        // Paw prints
        setInterval(() => {
            if (pausing || happyMode) return;
            const paw = document.createElement('span');
            paw.className = 'paw-print';
            paw.textContent = '🐾';
            paw.style.left = (corgiX + corgiSprite.offsetWidth / 2 - 8) + 'px';
            paw.style.transform = `scaleX(${direction})`;
            terminalBox.appendChild(paw);
            paw.addEventListener('animationend', () => paw.remove());
        }, 280);

        // Easter egg: Corgi click
        function spawnSparkle() {
            const spark = document.createElement('span');
            spark.className = 'sparkle';
            spark.textContent = ['✦','★','·','◆'][Math.floor(Math.random()*4)];
            spark.style.color = colors[Math.floor(Math.random()*colors.length)];
            const angle = Math.random() * Math.PI * 2;
            const r = 15 + Math.random() * 25;
            spark.style.left = (corgiSprite.offsetWidth/2 + Math.cos(angle)*r - 6) + 'px';
            spark.style.top  = (corgiSprite.offsetHeight/2 + Math.sin(angle)*r - 6) + 'px';
            corgiSprite.appendChild(spark);
            spark.addEventListener('animationend', () => spark.remove());
        }

        function corgiClick() {
            if (happyMode) return;
            happyMode = true;
            corgiImg.classList.add('happy');

            const sparkInterval = setInterval(() => {
                spawnSparkle(); spawnSparkle();
            }, 150);

            setTimeout(() => {
                clearInterval(sparkInterval);
                corgiImg.classList.remove('happy');
                happyMode = false;
            }, 1800);
        }
        corgiSprite.addEventListener('click', corgiClick);

        // Easter egg: Terminal dots
        const dotRed    = document.querySelector('.dot-red');
        const dotYellow = document.querySelector('.dot-yellow');
        const dotGreen  = document.querySelector('.dot-green');

        const originalTerminalHTML = terminalText.innerHTML;
        const extraDebugLines = `<br><span style="color:var(--blue)">[DEBUG]</span> Machanie ogonem: true<br><span style="color:var(--red)">[WARN]</span>&nbsp; Ostatni znany przysmak: 0<br><span style="color:var(--green)">[LOG]</span>&nbsp;&nbsp; Szukam... szukam...`;
        let expanded = false;

        dotRed.addEventListener('click', () => {
            if (terminal.classList.contains('closed')) return;
            terminal.classList.add('closed');
            const errMsg = document.createElement('div');
            errMsg.className = 'terminal-error-msg';
            errMsg.textContent = '[ERROR] Corgi odgryzł kabel 🐕';
            terminal.appendChild(errMsg);
            setTimeout(() => {
                terminal.classList.remove('closed');
                errMsg.remove();
            }, 3000);
        });

        dotYellow.addEventListener('click', () => {
            terminal.classList.toggle('minimized');
        });

        dotGreen.addEventListener('click', () => {
            if (expanded) {
                terminalText.innerHTML = originalTerminalHTML;
            } else {
                terminalText.innerHTML += extraDebugLines;
            }
            expanded = !expanded;
        });

        // Easter egg: Konami code
        const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiIdx   = 0;
        let partyActive = false;

        function activatePartyMode() {
            if (partyActive) return;
            partyActive = true;
            partySpeed = 3;
            document.body.classList.add('party');

            const partyMsg = document.createElement('div');
            partyMsg.style.cssText = 'color:var(--green);margin-top:12px';
            partyMsg.textContent = '[PARTY] 🎉 odkryłeś easter egga';
            terminalText.appendChild(partyMsg);

            setTimeout(() => {
                document.body.classList.remove('party');
                partySpeed = 1;
                partyMsg.remove();
                partyActive = false;
            }, 5000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === KONAMI[konamiIdx]) {
                konamiIdx++;
                if (konamiIdx === KONAMI.length) {
                    activatePartyMode();
                    konamiIdx = 0;
                }
            } else {
                konamiIdx = (e.key === KONAMI[0]) ? 1 : 0;
            }
        });
    </script>
</body>
</html>
