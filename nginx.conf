server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Każda nieznana ścieżka (np. cos.gdgpw.pl/jakas/strona) dostaje naszą stronę ze statusem 404,
    # a nie gołe „404 Not Found” od nginx. Dlatego w index.html wszystkie ścieżki zaczynają się od /.
    error_page 404 /index.html;

    # HTML, CSS i JS bez cache: zmiana po pushu widoczna od razu.
    # Samo no-cache Cloudflare nadpisuje na max-age=14400, private zostawia.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "private, no-cache" always;
    }

    # Sam adres domeny (/) zwraca 200, żeby sprawdzanie kontenera przy deployu przechodziło
    location = / {
    }

    location / {
        try_files $uri =404;
    }
}
